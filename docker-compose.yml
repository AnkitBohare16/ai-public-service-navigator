services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: public-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: public_service_navigator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d public_service_navigator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: